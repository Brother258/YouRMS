  <style>

  /* ============================================================
     YouRMS — design system
     Warm paper background, ink type, a single confident clay
     accent. Borders do most of the work; shadows are reserved
     for things that are actually lifted (hover states, the FAB).
     ============================================================ */

  :root {
    --paper:        #f7f4ee;
    --paper-raised: #fffdf9;
    --ink:          #1d1a16;
    --ink-soft:     #6b6458;
    --ink-faint:    #9a9385;
    --line:         #e6e0d2;
    --line-strong:  #d7cfba;

    --accent:       #b14323;
    --accent-ink:   #7c2c14;
    --accent-soft:  #f3e3d6;

    --good:         #2f6b4f;
    --good-soft:    #e2eee5;
    --bad:          #ad3434;
    --bad-soft:     #f6e2e1;

    --radius-sm: 8px;
    --radius:    14px;
    --radius-lg: 22px;

    --shadow-sm: 0 1px 2px rgba(29,26,22,0.05);
    --shadow-md: 0 10px 30px -8px rgba(29,26,22,0.16);
    --shadow-lg: 0 24px 60px -16px rgba(29,26,22,0.28);

    --ease: cubic-bezier(.22,.8,.32,1);
  }

  * , *::before, *::after { box-sizing: border-box; }

  html { font-size: 16px; scroll-behavior: smooth; }

  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--paper);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 4.5rem;
  }

  ::selection { background: var(--accent-soft); color: var(--accent-ink); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--line-strong);
    border-radius: 10px;
    border: 2px solid var(--paper);
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-faint); }

  a { color: var(--accent-ink); }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }

  h1, h2, h3 {
    font-family: 'Fraunces', Georgia, serif;
    color: var(--ink);
    letter-spacing: -0.01em;
    font-weight: 560;
  }

  /* ---------- Navigation ---------- */

  .site-nav {
    position: sticky;
    top: 0;
    z-index: 1000;
    width: 100%;
    background: rgba(247,244,238,0.82);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border-bottom: 1px solid transparent;
    transition: border-color .35s var(--ease), box-shadow .35s var(--ease);
  }
  .site-nav.is-scrolled {
    border-bottom-color: var(--line);
    box-shadow: 0 8px 24px -16px rgba(29,26,22,0.25);
  }
  .nav-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0.7rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .nav-brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    text-decoration: none;
    flex-shrink: 0;
  }
  .nav-brand img {
    height: 34px;
    width: auto;
    display: block;
  }
  .nav-links {
    display: flex;
    align-items: center;
    gap: 1.85rem;
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .nav-links a {
    position: relative;
    text-decoration: none;
    color: var(--ink-soft);
    font-weight: 500;
    font-size: 0.92rem;
    padding: 0.3rem 0;
  }
  .nav-links a::after {
    content: '';
    position: absolute;
    left: 0; bottom: -2px;
    width: 100%;
    height: 1.5px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: right;
    transition: transform .3s var(--ease);
  }
  .nav-links a:hover { color: var(--ink); }
  .nav-links a:hover::after { transform: scaleX(1); transform-origin: left; }

  .btn-restart {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    padding: 0.5rem 1.05rem;
    font-size: 0.85rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background .2s var(--ease), border-color .2s var(--ease), transform .15s var(--ease);
  }
  .btn-restart:hover { background: var(--paper-raised); border-color: var(--accent); color: var(--accent-ink); }
  .btn-restart:active { transform: scale(0.96); }
  .btn-restart i { font-size: 0.8rem; transition: transform .4s var(--ease); }
  .btn-restart:hover i { transform: rotate(-90deg); }

  .nav-toggle {
    display: none;
    background: none;
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    width: 38px; height: 38px;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--ink);
    font-size: 1.05rem;
  }

  @media (max-width: 760px) {
    .nav-links {
      position: absolute;
      top: 100%; left: 0; right: 0;
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
      background: var(--paper-raised);
      border-bottom: 1px solid var(--line);
      box-shadow: var(--shadow-md);
      max-height: 0;
      overflow: hidden;
      transition: max-height .35s var(--ease);
      padding: 0 1.5rem;
    }
    .site-nav.nav-open .nav-links {
      max-height: 280px;
      padding: 0.5rem 1.5rem 1rem;
    }
    .nav-links li { width: 100%; }
    .nav-links a { display: block; padding: 0.7rem 0; }
    .nav-links a::after { display: none; }
    .nav-links .btn-restart { margin: 0.4rem 0 0.6rem; width: 100%; justify-content: center; }
    .nav-toggle { display: flex; }
  }

  /* ---------- Page layout ---------- */

  .selected-container,
  #daily-schedule-summary,
  #schedule-container {
    width: 100%;
    max-width: 1180px;
    margin: 0 auto 2.25rem;
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  /* tiny utility set (kept so existing markup needs no edits) */
  .d-flex { display: flex; }
  .flex-wrap { flex-wrap: wrap; }
  .justify-content-between { justify-content: space-between; }
  .align-items-center { align-items: center; }
  .gap-2 { gap: 0.6rem; }
  .mb-3 { margin-bottom: 1.1rem; }

  /* ---------- Daily schedule summary ---------- */

  #daily-schedule-summary {
    margin-top: 1.75rem;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 1.5rem 1.75rem;
    animation: riseIn .5s var(--ease) both;
  }
  #daily-schedule-summary h3 {
    font-size: 1.2rem;
    margin: 0 0 0.9rem;
    color: var(--ink);
  }
  #daily-schedule-summary h3::before {
    content: '';
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 0.55rem;
    vertical-align: middle;
  }
  #daily-schedule-summary p {
    color: var(--ink-soft);
    margin: 0.35rem 0;
    font-size: 0.92rem;
    padding-left: 1.15rem;
  }
  #daily-schedule-summary p strong { color: var(--ink); font-weight: 600; }

  /* ---------- Selected courses ---------- */

  .selected-container h1 {
    font-size: 1.9rem;
    margin: 0;
  }
  .selected-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(270px,1fr));
    gap: 1rem;
  }
  .selected-card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 1.3rem 1.4rem;
    position: relative;
    animation: riseIn .45s var(--ease) both;
  }
  .selected-card:nth-of-type(1) { animation-delay: .02s; }
  .selected-card:nth-of-type(2) { animation-delay: .06s; }
  .selected-card:nth-of-type(3) { animation-delay: .1s; }
  .selected-card:nth-of-type(4) { animation-delay: .14s; }
  .selected-card:nth-of-type(5) { animation-delay: .18s; }
  .selected-card:nth-of-type(n+6) { animation-delay: .2s; }
  .selected-card:hover {
    border-color: var(--line-strong);
    box-shadow: var(--shadow-md);
    transform: translateY(-3px);
  }
  .selected-card h3 {
    font-size: 1.08rem;
    color: var(--accent-ink);
    margin: 0 0 0.55rem;
    padding-right: 1.6rem;
  }
  .selected-card p {
    font-size: 0.88rem;
    color: var(--ink-soft);
    margin: 0.22rem 0;
    font-family: 'Inter', sans-serif;
  }
  .selected-card p strong { color: var(--good); font-weight: 600; }
  .selected-card .delete-btn {
    position: absolute;
    top: 1.15rem; right: 1.15rem;
    background: none;
    border: none;
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem;
    color: var(--ink-faint);
    cursor: pointer;
    transition: background .2s var(--ease), color .2s var(--ease), transform .15s var(--ease);
  }
  .selected-card .delete-btn:hover {
    background: var(--bad-soft);
    color: var(--bad);
  }
  .selected-card .delete-btn:active { transform: scale(0.88); }

  /* ---------- Course sections / option cards ---------- */

  #schedule-container {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.75rem;
  }
  .course {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .course h2 {
    font-size: 1.15rem;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    color: var(--ink);
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 0.95rem 1.4rem;
    letter-spacing: 0.01em;
  }
  .card-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(270px,1fr));
    gap: 0.9rem;
    padding: 1.25rem;
  }
  .card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 1rem 1.1rem 1rem 1.4rem;
    position: relative;
    cursor: pointer;
    animation: riseIn .4s var(--ease) both;
    transition: border-color .2s var(--ease), box-shadow .2s var(--ease), transform .15s var(--ease);
  }
  .card::before {
    content: '';
    position: absolute;
    left: 0; top: 0.8rem; bottom: 0.8rem;
    width: 3px;
    border-radius: 3px;
    background: var(--line-strong);
    transition: background .2s var(--ease);
  }
  .card:hover {
    border-color: var(--line-strong);
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
  }
  .card:has(input:checked) {
    border-color: var(--good);
    background: var(--good-soft);
  }
  .card:has(input:checked)::before { background: var(--good); }

  .card input[type="checkbox"] {
    position: absolute;
    top: 1rem; right: 1rem;
    margin: 0;
    width: 20px; height: 20px;
    appearance: none;
    -webkit-appearance: none;
    border: 1.5px solid var(--line-strong);
    border-radius: 6px;
    background: var(--paper-raised);
    cursor: pointer;
    transition: background .15s var(--ease), border-color .15s var(--ease), transform .1s var(--ease);
  }
  .card input[type="checkbox"]:hover { border-color: var(--accent); }
  .card input[type="checkbox"]:active { transform: scale(0.88); }
  .card input[type="checkbox"]:checked {
    background: var(--good);
    border-color: var(--good);
  }
  .card input[type="checkbox"]:checked::after {
    content: '';
    position: absolute;
    left: 6px; top: 2px;
    width: 5px; height: 9px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(40deg);
  }

  .info { display: block; padding-right: 1.6rem; }
  .info span {
    display: block;
    margin: 0.28rem 0;
    font-size: 0.87rem;
    color: var(--ink-soft);
    font-family: 'Inter', sans-serif;
  }
  .tag {
    font-weight: 600;
    color: var(--ink);
    margin-right: 0.25rem;
  }

  @media (max-width: 600px) {
    .selected-container h1 { font-size: 1.55rem; }
    .course h2 { font-size: 1rem; }
    .selected-container, #daily-schedule-summary, #schedule-container {
      padding-left: 1.1rem; padding-right: 1.1rem;
    }
  }

  /* ---------- Share buttons (injected by share.js) ---------- */

  .btn {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    border-radius: 999px;
    padding: 0.5rem 1.05rem;
    border: 1px solid var(--line-strong);
    background: var(--paper-raised);
    color: var(--ink);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    transition: background .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease), transform .15s var(--ease);
  }
  .btn:active { transform: scale(0.96); }
  .btn-outline-success { border-color: var(--good); color: var(--good); }
  .btn-outline-success:hover { background: var(--good-soft); }
  .btn-outline-info { border-color: var(--accent); color: var(--accent-ink); }
  .btn-outline-info:hover { background: var(--accent-soft); }

  /* ---------- Floating add-course button ---------- */

  #add-course-btn {
    position: fixed;
    bottom: 5.5rem;
    right: 2rem;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 58px;
    height: 58px;
    font-size: 1.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-lg);
    cursor: pointer;
    z-index: 1000;
    transition: background .25s var(--ease), transform .25s var(--ease);
  }
  #add-course-btn:hover { background: var(--accent); transform: translateY(-3px); }
  #add-course-btn:active { transform: scale(0.92); }
  #add-course-btn i { transition: transform .3s var(--ease); }
  #add-course-btn:hover i { transform: rotate(90deg); }
  #add-course-btn::after {
    content: 'Add a course';
    position: absolute;
    right: calc(100% + 12px);
    top: 50%;
    transform: translateY(-50%) translateX(6px);
    background: var(--ink);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 0.4rem 0.75rem;
    border-radius: 999px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s var(--ease), transform .2s var(--ease);
  }
  #add-course-btn:hover::after { opacity: 1; transform: translateY(-50%) translateX(0); }
  @media (max-width: 600px) {
    #add-course-btn::after { display: none; }
    #add-course-btn { bottom: 4.75rem; right: 1.25rem; width: 52px; height: 52px; }
  }

  /* ---------- Footer / ticker ---------- */

  .site-footer {
    width: 100%;
    background: var(--paper-raised);
    border-top: 1px solid var(--line);
    position: fixed;
    bottom: 0;
    left: 0;
    z-index: 900;
  }
  .ticker {
    overflow: hidden;
    border-bottom: 1px solid var(--line);
    background: var(--accent-soft);
    padding: 0.4rem 0;
  }
  .ticker:hover .ticker-track { animation-play-state: paused; }
  .ticker-track {
    display: flex;
    width: max-content;
    gap: 4rem;
    animation: ticker 22s linear infinite;
    font-size: 0.8rem;
    color: var(--accent-ink);
    font-weight: 500;
  }
  .ticker-track span { white-space: nowrap; }
  .ticker-track a { color: var(--accent-ink); font-weight: 700; text-decoration: underline; }
  .footer-credit {
    text-align: center;
    font-size: 0.82rem;
    color: var(--ink-soft);
    padding: 0.55rem 1rem;
  }
  .footer-credit a { color: var(--ink); font-weight: 700; text-decoration: none; }
  .footer-credit a:hover { color: var(--accent-ink); text-decoration: underline; }

  @keyframes ticker {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- SweetAlert2 touch-ups ---------- */

  .swal2-popup {
    font-family: 'Inter', sans-serif !important;
    border-radius: var(--radius-lg) !important;
  }
  .swal2-title { font-family: 'Fraunces', serif !important; color: var(--ink) !important; }
  .swal2-html-container { color: var(--ink-soft) !important; }
  .swal2-styled.swal2-confirm {

    const examRules = [
      { start: 8*60,    end: 9*60+20,  dayIdx:0, time:"08:00 - 10:00 am" },

    let selected = JSON.parse(localStorage.getItem("selectedCourses") || "{}");
    function saveSelected() {
      localStorage.setItem("selectedCourses", JSON.stringify(selected));
    }

    function timeToMin(str) {
      let [hm, ap] = str.split(" ");
      let [h, m] = hm.split(":").map(Number);
      if (ap.toLowerCase() === "pm" && h !== 12) h += 12;
      if (ap.toLowerCase() === "am" && h === 12) h = 0;
      return h * 60 + m;
    }
    function parseTimeRange(r) {
      if (!r || typeof r !== 'string') return [NaN, NaN]; 

      r = r.replace(/\s+/g, ' ').trim();

      let [s, e] = r.split(" - ").map(x => x.trim()),
          m = e.match(/(am|pm)/i)?.[0].toLowerCase();

      if (m) {
        if (!/(am|pm)/i.test(s)) s += " " + m; 
        if (!/(am|pm)/i.test(e)) e += " " + m; 
      }

      let start = timeToMin(s),
          end = timeToMin(e);

      if (isNaN(start) || isNaN(end)) {
        console.error(`Invalid time range: ${r}`);
        return [NaN, NaN];
      }
      
      if (start > end) start -= 12 * 60; 
      
      return [start, end];
    }

    function normalizeDayToken(day) {
      const raw = (day || '').toString().trim().toLowerCase().replace(/\./g, '');
      const map = {
        sun: 'Sun', sunday: 'Sun',
        mon: 'Mon', monday: 'Mon',
        tue: 'Tue', tues: 'Tue', tuesday: 'Tue',
        wed: 'Wed', weds: 'Wed', wednesday: 'Wed',
        thu: 'Thu', thur: 'Thu', thurs: 'Thu', thursday: 'Thu',
        fri: 'Fri', friday: 'Fri',
        sat: 'Sat', saturday: 'Sat'
      };
      return map[raw] || (day || '').toString().trim();
    }




	  
    
	function extractDays(courseObj) {
  const isLab = courseObj.isLab;

  // For lab sections, try to read day codes from the teacher field first
  if (isLab && courseObj.teacher) {
    const insideParens = courseObj.teacher.match(/\(([^)]*)\)/)?.[1];

    if (insideParens) {
      const tokens = insideParens
        .split(/[,/&\s]+/)
        .map(t => t.trim())
        .filter(Boolean);

      const dayMap = {
        S: 'Sun',
        SUN: 'Sun',
        SUNDAY: 'Sun',

        M: 'Mon',
        MON: 'Mon',
        MONDAY: 'Mon',

        T: 'Tue',
        TUE: 'Tue',
        TUES: 'Tue',
        TUESDAY: 'Tue',

        W: 'Wed',
        WED: 'Wed',
        WEDNESDAY: 'Wed',

        TH: 'Thu',
        THU: 'Thu',
        THUR: 'Thu',
        THURS: 'Thu',
        THURSDAY: 'Thu',

        F: 'Fri',
        FRI: 'Fri',
        FRIDAY: 'Fri',

        SA: 'Sat',
        SAT: 'Sat',
        SATURDAY: 'Sat'
      };

      const days = tokens
        .map(t => dayMap[t.toUpperCase()])
        .filter(Boolean);

      if (days.length) {
        return [...new Set(days)];
      }
    }
  }

  // If days are wrapped in <mark>, read each marked day
  if (courseObj.days && courseObj.days.includes("<mark>")) {
    let tmp = document.createElement("div");
    tmp.innerHTML = courseObj.days;
    return [...tmp.querySelectorAll("mark")].map(x => normalizeDayToken(x.textContent));
  }

  // Normal case
  return (courseObj.days || "")
    .split("&")
    .map(x => normalizeDayToken(x));
}






    



    
    function mergeTimeSlots(timeSlotStrings) {
      if (!Array.isArray(timeSlotStrings) || timeSlotStrings.length === 0) {
        return [];
      }

      const parsedSlots = timeSlotStrings.map(slot => {
        const [start, end] = parseTimeRange(slot);
        return { original: slot, start, end };
      }).filter(slot => !isNaN(slot.start) && !isNaN(slot.end));

      if (parsedSlots.length === 0) {
        return [];
      }

      parsedSlots.sort((a, b) => a.start - b.start);

      const merged = [];
      let currentMerge = parsedSlots[0];

      for (let i = 1; i < parsedSlots.length; i++) {
        const nextSlot = parsedSlots[i];
        if (nextSlot.start <= currentMerge.end + 5) { 
          currentMerge.end = Math.max(currentMerge.end, nextSlot.end); 
        } else {
          merged.push({ start: currentMerge.start, end: currentMerge.end });
          currentMerge = nextSlot; 
        }
      }
      merged.push({ start: currentMerge.start, end: currentMerge.end }); 

      const formatMinToTime = (min) => {
        let hh = Math.floor(min / 60);
        let mm = min % 60;
        let period = "am";
        if (hh >= 12) period = "pm";
        if (hh > 12) hh -= 12;
        if (hh === 0) hh = 12; 
        return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')} ${period}`;
      };

      return merged.map(slot => `${formatMinToTime(slot.start)} - ${formatMinToTime(slot.end)}`);
    }

    









    

    function findConflict(newE, courseKey) {
      const newETimeSlots = Array.isArray(newE.time) ? newE.time : [newE.time];
      const nd = extractDays(newE); 

      for (let c in selected) {
        if (c === courseKey) continue; 

        let e = selected[c]; 
        const existingTimeSlots = Array.isArray(e.time) ? e.time : [e.time];
        const ed = extractDays(e); 

        for (const newSlotStr of newETimeSlots) {
          let [ns, ne] = parseTimeRange(newSlotStr);
          if (isNaN(ns) || isNaN(ne)) continue; 

          for (const existingSlotStr of existingTimeSlots) {
            let [es, ee] = parseTimeRange(existingSlotStr);
            if (isNaN(es) || isNaN(ee)) continue; 

            let day = nd.find(d => ed.includes(d)); 
            if (day && ns < ee && es < ne) { 
              let os = Math.max(ns, es),
                  oe = Math.min(ne, ee),
                  fmt = m => {
                    let hh = Math.floor(m/60), mm = m % 60, pp = hh >= 12;
                    if (hh > 12) hh -= 12;
                    if (hh === 0) hh = 12;
                    return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')} ${pp ? 'pm' : 'am'}`;
                  };
              return { course: c, section: e.section, day, time: `${fmt(os)} - ${fmt(oe)}` };
            }
          }
        }
      }
      return false;
    }

    const selContainer = document.querySelector(".selected-container");
    const selGrid = document.getElementById("selected-courses");
    const summaryContainer = document.getElementById("daily-schedule-summary");
    const schedContainer = document.getElementById("schedule-container");

    function renderSelected() {
      selGrid.innerHTML = "";
      for (let k in selected) {
        let e = selected[k],
            isLab = e.isLab, 
            times = Array.isArray(e.time) ? e.time.join(", ") : e.time,
            isGefSpecial = isGef1101Family(k),
            specialTime = formatGefDayTimePairs(e.dayTimePairs),
            examInfo = isLab
                ? "No exam"
                : (() => {
                    let [st] = parseTimeRange(Array.isArray(e.time) ? e.time[0] : e.time), 
                        rule = examRules.find(r => r.start === st);
                    if (!rule) return "Exam time TBD";
                    let day = extractDays(e)[rule.dayIdx] || "TBD"; 
                    return `Exam: ${day}, ${rule.time}`;
                  })(),
            card = document.createElement("div");

        card.className = "selected-card";
        card.innerHTML = `
          <h3>${k}</h3>
          <p>Section: ${e.section}</p>
          <p>Room: ${e.room}</p>
          <p>Teacher: ${e.teacher}</p>
          <p>Days: ${e.days}</p>
          ${isGefSpecial && specialTime ? `<p>${specialTime}</p>` : `<p>Time: ${times}</p>`}
          <p><strong>${examInfo}</strong></p>
          <button class="delete-btn"><i class="fas fa-trash"></i></button>
        `;
        card.querySelector(".delete-btn").onclick = () => {
          Swal.fire({
            icon: 'warning', title: 'Remove Course?',
            text: `Delete ${k}?`, showCancelButton: true,
            confirmButtonText: 'Yes', cancelButtonText: 'No'
          }).then(res => {
            if (res.isConfirmed) {
              delete selected[k];
              saveSelected();
              renderSelected();
              renderSchedule();
              Swal.fire({
                icon: 'success',
                title: 'Deleted',
                toast: true,
                position: 'top',
                timer: 1200,
                showConfirmButton: false
              });
            }
          });
        };
        selGrid.appendChild(card);
      }
      renderDailyScheduleSummary();
      updatePanelsVisibility();
      if (window.renderShareControls) {
          window.renderShareControls();
      }
    }

    function renderDailyScheduleSummary() {
      const summaryContainer = document.getElementById("daily-schedule-summary");
      if (!summaryContainer) return;

      const dayTimes = {};

      for (let key in selected) {
        const entry = selected[key]; 
        const timeSlots = Array.isArray(entry.time) ? entry.time : [entry.time];
        const classDays = extractDays(entry); 

        for (let day of classDays) {
          if (!dayTimes[day]) {
            dayTimes[day] = [];
          }
          timeSlots.forEach(slot => {
            const [start, end] = parseTimeRange(slot); 
            dayTimes[day].push([start, end]);
          });
        }
      }

      const formatTime = (min) => {
        let hh = Math.floor(min / 60),
            mm = min % 60,
            ap = hh >= 12 ? "pm" : "am";
        if (hh > 12) hh -= 12;
        if (hh === 0) hh = 12;
        return `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")} ${ap}`;
      };

      summaryContainer.innerHTML = "<h3>Daily Class Summary</h3>";
      Object.entries(dayTimes).forEach(([day, times]) => {
        const sortedTimes = times.sort((a, b) => a[0] - b[0]);
        const earliest = sortedTimes[0][0];
        const latest = sortedTimes[sortedTimes.length - 1][1];

        summaryContainer.innerHTML += `<p><strong>${day}:</strong> ${formatTime(earliest)} - ${formatTime(latest)}</p>`;
      });
    }

    function renderSchedule() {
      schedContainer.innerHTML = "";
      for (let courseKey in data) { 
        let box = document.createElement("div");
        box.className = "course";
        box.innerHTML = `<h2>${courseKey}</h2><div class="card-container"></div>`;
        let cc = box.querySelector(".card-container");

        data[courseKey].forEach(entry => { 
          let isSel = selected[courseKey]?.section === entry.section,
              card = document.createElement("div");
          card.className = "card";

          const isGefSpecial = isGef1101Family(courseKey);
          const displayTime = Array.isArray(entry.time) ? entry.time.join(", ") : entry.time;
          const specialTime = formatGefDayTimePairs(entry.dayTimePairs);

          card.innerHTML = `
            <input type="checkbox" ${isSel ? "checked" : ""}>
            <div class="info">
              <span class="tag">Section:</span> ${entry.section}
              <span class="tag">Room:</span> ${entry.room}
              <span class="tag">Teacher:</span> ${entry.teacher} - ${teacherFull[entry.teacher.split(" ")[0]] || "Unknown"}
              <span class="tag">Days:</span> ${entry.days}
              ${isGefSpecial && specialTime ? specialTime : `<span class="tag">Time:</span> ${displayTime}`}
            </div>
          `;
          let cb = card.querySelector("input");
          cb.onchange = () => {
            let newE = entry; 

            if (!cb.checked) {
              delete selected[courseKey];
              saveSelected();
              renderSelected();
              renderSchedule();
              return Swal.fire({
                icon: 'success',
                title: 'Removed',
                toast: true,
                position: 'top',
                timer: 1200,
                showConfirmButton: false
              });
            }
            
            let conf = findConflict(newE, courseKey); 
            if (conf) {
              cb.checked = false;
              return Swal.fire({
                icon: 'error',
                title: 'Conflict',
                html: `Clashes with <strong>${conf.course} Sec ${conf.section}</strong><br>
                       On <strong>${conf.day}</strong> at <strong>${conf.time}</strong>`
              });
            }
            if (selected[courseKey] && selected[courseKey].section !== newE.section) {
              return Swal.fire({
                icon: 'warning',
                title: 'Replace Section?',
                text: `You have Sec ${selected[courseKey].section}. Replace with Sec ${newE.section}?`,
                showCancelButton: true,
                confirmButtonText: 'Yes',
                cancelButtonText: 'No'
              }).then(res => {
                if (res.isConfirmed) {
                  selected[courseKey] = newE; 
                  saveSelected();
                  renderSelected();
                  renderSchedule();
                  Swal.fire({
                    icon: 'success',
                    title: 'Replaced',
                    toast: true,
                    position: 'top',
                    timer: 1200,
                    showConfirmButton: false
                  });
                } else {
                  cb.checked = false;
                }
              });
            } else {
              selected[courseKey] = newE; 
              saveSelected();
              renderSelected();
              renderSchedule();
              Swal.fire({
                icon: 'success',
                title: 'Saved',
                toast: true,
                position: 'top',
                timer: 1200,
                showConfirmButton: false
              });
            }
          };
          cc.appendChild(card);
        });

        schedContainer.appendChild(box);
      }
    }

    function updatePanelsVisibility() {
      const hasSelection = Object.keys(selected).length > 0;
      summaryContainer.style.display = hasSelection ? "" : "none";
      selContainer.style.display = hasSelection ? "" : "none";
    }

    function normalizeTimeFormat(time) {
      if (!time || typeof time !== 'string') return null;

      time = time.replace(/\s+/g, ' ').trim();

      if (!/(am|pm)/i.test(time)) {
        const [start, end] = time.split('-').map(t => t.trim());
        const startHour = parseInt(start.split(':')[0], 10);
        const endHour = parseInt(end.split(':')[0], 10);

        if (startHour >= 8 && startHour < 12) {
          time = `${start} am - ${end} am`;
        } else if (startHour >= 12 || endHour >= 12) {
          time = `${start} pm - ${end} pm`;
        }
      }

      return time;
    }

    function isExplicitLabSection(sectionText) {
      const sec = (sectionText || '').toString().trim();
      return /\bL\b/i.test(sec) || /L$/i.test(sec);
    }

    function hasLabLikeDuration(timeSlots, minMinutes = 115) {
      if (!Array.isArray(timeSlots) || !timeSlots.length) return false;
      return timeSlots.some(slot => {
        const [start, end] = parseTimeRange(slot);
        if (isNaN(start) || isNaN(end)) return false;
        return (end - start) >= minMinutes;
      });
    }

    function isGef1101Family(courseKey) {
      const k = (courseKey || '').toString().trim().toUpperCase();
      return k === 'GEF 1101' || k === '0231-000-1101';
    }





function getLabDayFromTeacher(teacherText) {
  const raw = (teacherText || '').toString();
  const insideParens = raw.match(/\(([^)]*)\)/)?.[1] || '';

  const tokens = insideParens
    .split(/[,/&\s]+/)
    .map(t => t.trim().replace(/\./g, ''))
    .filter(Boolean);

  const dayMap = {
    S: 'Sun',
    SUN: 'Sun',
    SUNDAY: 'Sun',

    M: 'Mon',
    MON: 'Mon',
    MONDAY: 'Mon',

    T: 'Tue',
    TUE: 'Tue',
    TUES: 'Tue',
    TUESDAY: 'Tue',

    W: 'Wed',
    WED: 'Wed',
    WEDNESDAY: 'Wed',

    TH: 'Thu',
    THU: 'Thu',
    THUR: 'Thu',
    THURS: 'Thu',
    THURSDAY: 'Thu',

    F: 'Fri',
    FRI: 'Fri',
    FRIDAY: 'Fri',

    SA: 'Sat',
    SAT: 'Sat',
    SATURDAY: 'Sat'
  };

  for (const token of tokens) {
    const day = dayMap[token.toUpperCase()];
    if (day) return day;
  }

  return '';
} 




	  

    function normalizeEntryDays(courseKey, dayText, teacherText = '', isLab = false) {
  const raw = (dayText || '').toString().trim();
  if (!raw) return 'Unknown Days';

  if (isGef1101Family(courseKey) && /ENG\s*LAB\s*&\s*ESK/i.test(raw)) {
    return 'Thu';
  }

  if (isLab) {
  const labDay = getLabDayFromTeacher(teacherText);
  if (labDay) return labDay;
  return normalizeDayToken(raw.split('&')[0]);
}

  return raw
    .replace(/Sun\s*&\s*Tue/i, 'Sun & Tue')
    .replace(/Mon\s*&\s*Wed/i, 'Mon & Wed');
}

	  

    function splitDayTokens(dayText) {
      const txt = (dayText || '').toString().trim();
      if (!txt) return [];
      if (txt.includes('<mark>')) {
        const tmp = document.createElement('div');
        tmp.innerHTML = txt;
        return [...tmp.querySelectorAll('mark')].map(x => x.textContent.trim()).filter(Boolean);
      }
      if (txt.includes('&')) return txt.split('&').map(x => x.trim()).filter(Boolean);
      return [txt];
    }

    function mergeDayLabels(existingDays, incomingDays) {
      const order = ['Sun', 'Monday', 'Mon', 'Tuesday', 'Tue', 'Wednesday', 'Wed', 'Thu', 'Thursday', 'Fri', 'Friday', 'Sat', 'Saturday'];
      const seen = new Set();
      [...splitDayTokens(existingDays), ...splitDayTokens(incomingDays)].forEach(d => {
        if (d) seen.add(d);
      });
      const arr = Array.from(seen);
      arr.sort((a, b) => {
        const ai = order.findIndex(o => o.toLowerCase() === a.toLowerCase());
        const bi = order.findIndex(o => o.toLowerCase() === b.toLowerCase());
        const av = ai === -1 ? 999 : ai;
        const bv = bi === -1 ? 999 : bi;
        return av - bv;
      });
      return arr.join(' & ');
    }

    function formatGefDayTimePairs(dayTimePairs) {
      if (!Array.isArray(dayTimePairs) || !dayTimePairs.length) return '';
      return dayTimePairs.map(p => {
        const d = (p.days || '').trim();
        const times = Array.isArray(p.time) ? p.time.join(', ') : (p.time || '');
        if (!d || !times) return '';
        const label = /^Thu$/i.test(d) ? 'Thu (Listening & Speaking)' : d;
        return `<span><span class="tag">${label}:</span> ${times}</span>`;
      }).filter(Boolean).join('');
    }

    function validateAndNormalizeData(courseData) {
      const normalizedData = {};

      for (let courseKey in courseData) {
        if (!Array.isArray(courseData[courseKey])) {
          console.error(`Invalid data for course ${courseKey}: Expected an array.`);
          continue;
        }

        const sectionsMap = {};
        const courseHasExplicitLabSection = courseData[courseKey].some(entry => {
          if (!Array.isArray(entry) || entry.length < 1) return false;
          return isExplicitLabSection(entry[0] || '');
        });

        courseData[courseKey].forEach(entry => {
          if (!Array.isArray(entry) || entry.length < 5) {
            console.error(`Invalid entry in ${courseKey}:`, entry);
            return; 
          }

          let rawSection = entry[0] || 'Unknown Section';
          let normalizedSection = rawSection.replace(/\s*L$/i, '').trim();

          let timeSlots = [];
          if (entry[4].includes(",")) {
            timeSlots = entry[4].split(',').map(t => normalizeTimeFormat(t.trim()));
          } else {
            timeSlots = [normalizeTimeFormat(entry[4])];
          }
          timeSlots = timeSlots.filter(Boolean);

          const explicitLab = courseKey.toLowerCase().includes("lab") || isExplicitLabSection(rawSection);
          const inferredLab = !explicitLab && courseHasExplicitLabSection && hasLabLikeDuration(timeSlots);
          const isLabEntry = explicitLab || inferredLab;

          if (sectionsMap[normalizedSection]) {
            sectionsMap[normalizedSection].time = sectionsMap[normalizedSection].time.concat(timeSlots);
            sectionsMap[normalizedSection].isLab = sectionsMap[normalizedSection].isLab || isLabEntry;
            sectionsMap[normalizedSection].dayTimePairs.push({
              days: normalizeEntryDays(courseKey, entry[3] || 'Unknown Days', entry[2] || 'Unknown Teacher', isLabEntry),
              time: timeSlots
            });
            sectionsMap[normalizedSection].days = mergeDayLabels(
              sectionsMap[normalizedSection].days,
              normalizeEntryDays(courseKey, entry[3] || 'Unknown Days', entry[2] || 'Unknown Teacher', isLabEntry)
            );
          } else {
            sectionsMap[normalizedSection] = {
              section: rawSection, 
              room: entry[1] || 'Unknown Room',
              teacher: entry[2] || 'Unknown Teacher',
              days: normalizeEntryDays(courseKey, entry[3] || 'Unknown Days', entry[2] || 'Unknown Teacher', isLabEntry),
              time: timeSlots, 
              isLab: isLabEntry,
              courseKey: courseKey,
              dayTimePairs: [{
                days: normalizeEntryDays(courseKey, entry[3] || 'Unknown Days', entry[2] || 'Unknown Teacher', isLabEntry),
                time: timeSlots
              }]
            };
          }
        });

        normalizedData[courseKey] = Object.values(sectionsMap).map(sectionEntry => {
          if (sectionEntry.isLab) { 
            sectionEntry.time = mergeTimeSlots(sectionEntry.time);
          }
          if (!Array.isArray(sectionEntry.time)) {
             sectionEntry.time = [sectionEntry.time];
          }
          return sectionEntry;
        });
      }

      return normalizedData;
    }

    function buildCourseIdCandidates(inputId) {
      const source = (inputId || '').toString().trim();
      if (!source) return [];

      const candidates = [];
      const add = (v) => {
        const val = (v || '').trim();
        if (!val) return;
        if (!candidates.includes(val)) candidates.push(val);
      };

      const upper = source.toUpperCase().replace(/\s+/g, ' ').trim();
      add(source);
      add(upper);

      // Try existing-course formats: CSE2104 <-> CSE 2104
      const compact = upper.replace(/\s+/g, '');
      const existingMatch = compact.match(/^([A-Z]{2,4})(\d{3,4}(?:-[A-Z])?[A-Z]?)$/);
      if (existingMatch) {
        add(`${existingMatch[1]} ${existingMatch[2]}`);
        add(`${existingMatch[1]}${existingMatch[2]}`);
      }

      // Try UNESCO formats with normalized hyphen groups.
      const unescoDigits = upper.replace(/\s*[- ]\s*/g, '-');
      const unescoMatch = unescoDigits.match(/^(\d{3,4})-(\d{3})-(\d{3,4})$/);
      if (unescoMatch) {
        add(`${unescoMatch[1]}-${unescoMatch[2]}-${unescoMatch[3]}`);
      }

      return candidates;
    }

    async function loadCourseJSON(courseId) {
      const candidates = buildCourseIdCandidates(courseId);

      for (const candidate of candidates) {
        try {
          let response = await fetch(`${encodeURIComponent(candidate)}.json`);
          if (!response.ok) {
            continue;
          }

          let json = await response.json();
          const validatedData = validateAndNormalizeData(json);

          for (let key in validatedData) {
            data[key] = validatedData[key];
          }
          return candidate;
        } catch (err) {
          console.error(`Failed to load ${candidate}.json:`, err);
        }
      }

      console.error(`Could not resolve JSON for input: ${courseId}`);
      return null;
    }

    async function promptForCourses() {
      let added = [];

      const allCourseCodes = (typeof COURSE_DATA !== 'undefined')
        ? Array.from(new Set(Object.keys(COURSE_DATA).map(k => k.trim()).filter(Boolean))).sort((a, b) => a.localeCompare(b))
        : [];

      const buildSuggestions = (query, limit = 30) => {
        const q = (query || '').trim().toUpperCase();
        if (!q) return allCourseCodes.slice(0, limit);

        const startsWith = [];
        const includes = [];
        for (const code of allCourseCodes) {
          const upper = code.toUpperCase();
          if (upper.startsWith(q)) {
            startsWith.push(code);
          } else if (upper.includes(q)) {
            includes.push(code);
          }
          if ((startsWith.length + includes.length) >= limit) break;
        }
        return startsWith.concat(includes).slice(0, limit);
      };

      while (true) {
        let { value: courseId } = await Swal.fire({
          title: 'Add a course',
          input: 'text',
          inputPlaceholder: 'Enter course ID (e.g. CSE 2101)',
          didOpen: () => {
            const input = Swal.getInput();
            if (!input) return;

            // Prevent browser history/autofill suggestions from appearing.
            input.setAttribute('autocomplete', 'off');
            input.setAttribute('autocorrect', 'off');
            input.setAttribute('autocapitalize', 'off');
            input.setAttribute('spellcheck', 'false');
            input.name = `course-code-${Date.now()}`;

            const listId = 'course-code-suggestions';
            let dl = document.getElementById(listId);
            if (dl) dl.remove();

            dl = document.createElement('datalist');
            dl.id = listId;
            document.body.appendChild(dl);
            input.setAttribute('list', listId);

            const refreshList = () => {
              const suggestions = buildSuggestions(input.value);
              dl.innerHTML = suggestions.map(code => `<option value="${code}"></option>`).join('');
            };

            refreshList();
            input.addEventListener('input', refreshList);
          },
          showCancelButton: true,
          inputValidator: (value) => {
            if (!value) return 'Course ID cannot be empty';
            return null;
          }
        });
        if (!courseId) break; 
        courseId = courseId.trim();
        let resolvedId = await loadCourseJSON(courseId);
        if (resolvedId) {
          added.push(resolvedId);
          Swal.fire({
            icon: 'success',
            title: `${resolvedId}.json loaded`,
            toast: true,
            position: 'top',
            timer: 1200,
            showConfirmButton: false
          });
        } else {
          await Swal.fire({
            icon: 'error',
	    title: `Bro, Wait! Read this carefully.`,
            //title: `Could not find ${courseId}.Read this carefully!`,
            text: 'Please check the filename and try again. For Unesco Course Code write with hyphen. Example : 0200-017-1301. And for Regular Course Code write with gap. Example : CSE 2301'
          });
        }
        let { isConfirmed } = await Swal.fire({
          icon: 'question',
          title: 'Add another course?',
          showCancelButton: true,
          confirmButtonText: 'Yes',
          cancelButtonText: 'No'
        });
        if (!isConfirmed) break;
      }
      if (added.length > 0) {
        let stored = JSON.parse(localStorage.getItem('addedCourses') || '[]');
        let unique = Array.from(new Set([...stored, ...added]));
        localStorage.setItem('addedCourses', JSON.stringify(unique));
      }
      toggleAddCourseButton(true); 
    }

    function toggleAddCourseButton(show) {
      const addCourseBtn = document.getElementById("add-course-btn");
      addCourseBtn.style.display = show ? "flex" : "none";
    }

    document.getElementById("add-course-btn").addEventListener("click", async () => {
      await promptForCourses();
      renderSelected();
      renderSchedule();
    });

    async function loadAllStoredCourses() {
      let stored = JSON.parse(localStorage.getItem('addedCourses') || '[]');
      for (let cid of stored) {
        await loadCourseJSON(cid);
      }
    }

    async function showWhatsAppPopup() {
        const maxShows = 1;
        const key = 'whatsapp_popup_count';
        const joinedKey = 'whatsapp_joined';

        if (localStorage.getItem(joinedKey) === 'yes') {
            return;
			await handleSharedLink();
        }

        let count = parseInt(localStorage.getItem(key)) || 0;

        if (count < maxShows) {
            const result = await Swal.fire({
                title: 'Join Our WhatsApp Community',
                text: 'Get updates, ask questions and get help whenever you’re stuck.',
                icon: 'info',
                showCancelButton: true,
                confirmButtonText: 'Join Now',
                cancelButtonText: 'Not Now',
                confirmButtonColor: '#25D366',
                reverseButtons: false
            });

            if (result.isConfirmed) {
                localStorage.setItem(joinedKey, 'yes');
                window.open('https://chat.whatsapp.com/B9vRwSqcdCHG36Bso5EMjS?mode=wwt', '_blank');
				await handleSharedLink();
            } else {
                localStorage.setItem(key, count + 1);
				await handleSharedLink();
            }
        }
    }

    window.__appInitialized = false;
    window.initApp = async function() {
      if (window.__appInitialized) return;
      window.__appInitialized = true;

      await showWhatsAppPopup();

      let stored = JSON.parse(localStorage.getItem('addedCourses') || '[]');
      if (stored.length === 0) {
        await promptForCourses();
      } else {
        toggleAddCourseButton(true); 
      }
      await loadAllStoredCourses();
      renderSelected();
      renderSchedule();
    };

    // Fallback: if share.js is missing or does not call initApp, initialize here.
    setTimeout(() => {
      if (!window.__appInitialized) {
        window.initApp();
      }
    }, 50);


  </script>

<script>
(function () {
  "use strict";

  // ---------- persisted state ----------
  let facultyRanks = JSON.parse(localStorage.getItem('rb_facultyRanks') || '{}');
  let rbMaxDays = parseInt(localStorage.getItem('rb_maxDays') || '3', 10) || 3;
  let rbWindow = JSON.parse(localStorage.getItem('rb_window') || 'null');
  let rbResults = null;

  const DAY_ORDER = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  function fmtMin(min) {
    let hh = Math.floor(min / 60), mm = ((min % 60) + 60) % 60, ap = 'am';
    if (hh >= 12) ap = 'pm';
    let h12 = hh % 12; if (h12 === 0) h12 = 12;
    return `${String(h12).padStart(2, '0')}:${String(mm).padStart(2, '0')} ${ap}`;
  }

  function teacherCodeOf(entry) {
    return ((entry && entry.teacher) || '').split(' ')[0] || 'TBA';
  }
  function teacherLabelOf(entry) {
    const code = teacherCodeOf(entry);
    return (typeof teacherFull !== 'undefined' && teacherFull[code]) || (entry && entry.teacher) || 'TBA';
  }

  function collectTimePoints() {
    const starts = new Set(), ends = new Set(), days = new Set();
    Object.keys(data).forEach(k => {
      (data[k] || []).forEach(entry => {
        const slots = Array.isArray(entry.time) ? entry.time : [entry.time];
        slots.forEach(s => {
          const r = parseTimeRange(s);
          if (r && !isNaN(r[0])) starts.add(r[0]);
          if (r && !isNaN(r[1])) ends.add(r[1]);
        });
        extractDays(entry).forEach(d => { if (d) days.add(d); });
      });
    });
    return {
      starts: [...starts].sort((a, b) => a - b),
      ends: [...ends].sort((a, b) => a - b),
      days: DAY_ORDER.filter(d => days.has(d))
    };
  }

  function closestTo(arr, target) {
    if (!arr.length) return null;
    return arr.reduce((best, v) => Math.abs(v - target) < Math.abs(best - target) ? v : best, arr[0]);
  }

  // ---------- modal open/close ----------
  const overlay = document.getElementById('routine-builder-overlay');
  const openBtn = document.getElementById('routine-builder-btn');
  const closeBtn = document.getElementById('rb-close');

  function openModal() {
    const courseKeys = Object.keys(data);
    document.getElementById('rb-empty').style.display = courseKeys.length === 0 ? 'block' : 'none';
    document.getElementById('rb-content').style.display = courseKeys.length === 0 ? 'none' : 'block';
    if (courseKeys.length > 0) {
      buildFacultyUI(courseKeys);
      buildLimitsUI();
    }
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }
  openBtn.addEventListener('click', openModal);
  closeBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal(); });

  // ---------- step 1: faculty ranking (click only, no typing) ----------
  function buildFacultyUI(courseKeys) {
    const list = document.getElementById('rb-faculty-list');
    list.innerHTML = '';

    courseKeys.forEach(courseKey => {
      const entries = data[courseKey] || [];
      const seen = new Set();
      const teachers = [];
      entries.forEach(entry => {
        const code = teacherCodeOf(entry);
        if (!seen.has(code)) { seen.add(code); teachers.push(code); }
      });

      const box = document.createElement('div');
      box.className = 'rb-faculty-course';

      const title = document.createElement('div');
      title.className = 'rb-faculty-course-title';
      title.innerHTML = courseKey + ' <span class="rb-section-count">' + entries.length + ' section' + (entries.length === 1 ? '' : 's') + '</span>';
      box.appendChild(title);

      const row = document.createElement('div');
      row.className = 'rb-chip-row';

      teachers.forEach(code => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'rb-chip';
        chip.dataset.code = code;
        chip.addEventListener('click', function () {
          toggleRank(courseKey, code);
          paintChips(courseKey, row);
        });
        row.appendChild(chip);
      });

      box.appendChild(row);
      list.appendChild(box);
      paintChips(courseKey, row);
    });
  }

  function toggleRank(courseKey, code) {
    const arr = facultyRanks[courseKey] = facultyRanks[courseKey] || [];
    const idx = arr.indexOf(code);
    if (idx === -1) arr.push(code);
    else arr.splice(idx, 1);
    localStorage.setItem('rb_facultyRanks', JSON.stringify(facultyRanks));
  }

  function teacherFullLabelFromCode(courseKey, code) {
    const entries = data[courseKey] || [];
    const found = entries.find(e => teacherCodeOf(e) === code);
    return found ? teacherLabelOf(found) : code;
  }

  function paintChips(courseKey, row) {
    const arr = facultyRanks[courseKey] || [];
    row.querySelectorAll('.rb-chip').forEach(chip => {
      const code = chip.dataset.code;
      const idx = arr.indexOf(code);
      const label = teacherFullLabelFromCode(courseKey, code);
      if (idx === -1) {
        chip.className = 'rb-chip';
        chip.innerHTML = label;
      } else {
        chip.className = 'rb-chip ranked';
        chip.innerHTML = '<span class="rb-rank-badge">' + (idx + 1) + '</span> ' + label;
      }
    });
  }

  // ---------- step 2: limits (steppers + pills, no typing) ----------
  let rbAvailableDaysCount = 6;

  function buildLimitsUI() {
    const pts = collectTimePoints();
    rbAvailableDaysCount = Math.max(1, pts.days.length || 6);

    if (rbMaxDays > rbAvailableDaysCount) rbMaxDays = rbAvailableDaysCount;
    if (!rbMaxDays) rbMaxDays = Math.min(3, rbAvailableDaysCount);

    if (!rbWindow || rbWindow.start == null || rbWindow.end == null) {
      const defStart = closestTo(pts.starts, 10 * 60 + 50);
      const defEnd = closestTo(pts.ends, 15 * 60 + 25);
      rbWindow = {
        start: defStart != null ? defStart : (pts.starts[0] || 0),
        end: defEnd != null ? defEnd : (pts.ends[pts.ends.length - 1] || 1440)
      };
    }

    renderDaysStepper();
    renderPills('rb-start-pills', pts.starts, rbWindow.start, function (v) { rbWindow.start = v; saveWindow(); renderWindowReadout(); });
    renderPills('rb-end-pills', pts.ends, rbWindow.end, function (v) { rbWindow.end = v; saveWindow(); renderWindowReadout(); });
    renderWindowReadout();
  }

  function saveWindow() { localStorage.setItem('rb_window', JSON.stringify(rbWindow)); }

  function renderDaysStepper() {
    const minus = document.getElementById('rb-days-minus');
    const plus = document.getElementById('rb-days-plus');
    const val = document.getElementById('rb-days-value');
    const readout = document.getElementById('rb-days-readout');

    function paint() {
      val.textContent = rbMaxDays;
      readout.textContent = rbMaxDays + ' day' + (rbMaxDays === 1 ? '' : 's');
      minus.disabled = rbMaxDays <= 1;
      plus.disabled = rbMaxDays >= rbAvailableDaysCount;
      localStorage.setItem('rb_maxDays', String(rbMaxDays));
    }
    minus.onclick = function () { if (rbMaxDays > 1) { rbMaxDays--; paint(); } };
    plus.onclick = function () { if (rbMaxDays < rbAvailableDaysCount) { rbMaxDays++; paint(); } };
    paint();
  }

  function renderPills(containerId, points, activeVal, onPick) {
    const el = document.getElementById(containerId);
    el.innerHTML = '';
    points.forEach(p => {
      const pill = document.createElement('button');
      pill.type = 'button';
      pill.className = 'rb-pill' + (p === activeVal ? ' active' : '');
      pill.textContent = fmtMin(p);
      pill.addEventListener('click', function () {
        onPick(p);
        el.querySelectorAll('.rb-pill').forEach(b => b.classList.remove('active'));
        pill.classList.add('active');
      });
      el.appendChild(pill);
    });
  }

  function renderWindowReadout() {
    document.getElementById('rb-window-readout').textContent = fmtMin(rbWindow.start) + ' \u2013 ' + fmtMin(rbWindow.end);
  }

  // ---------- the solver: plain backtracking search, no AI involved ----------
  function solve(courseKeys, maxDays, win, ranks, opts) {
    opts = opts || {};
    const stopAtFirst = !!opts.stopAtFirst;

    const order = courseKeys.slice().sort((a, b) => (data[a] || []).length - (data[b] || []).length);
    const metaCache = new Map();

    function getMeta(entry) {
      let m = metaCache.get(entry);
      if (m) return m;
      const days = extractDays(entry).filter(Boolean);
      const timeStrs = Array.isArray(entry.time) ? entry.time : [entry.time];
      const slots = [];
      let timeCost = 0;
      timeStrs.forEach(s => {
        const r = parseTimeRange(s);
        if (!r || isNaN(r[0]) || isNaN(r[1])) return;
        slots.push(r);
        timeCost += Math.max(0, win.start - r[0]) + Math.max(0, r[1] - win.end);
      });
      m = { days, slots, teacherCode: teacherCodeOf(entry), timeCost };
      metaCache.set(entry, m);
      return m;
    }

    function facultyCost(courseKey, entry) {
      const arr = ranks[courseKey] || [];
      if (!arr.length) return 0;
      const idx = arr.indexOf(getMeta(entry).teacherCode);
      return idx === -1 ? arr.length : idx;
    }

    const busy = {};
    const dayCount = {};
    let daysUsed = 0;

    function hasConflict(meta) {
      for (const day of meta.days) {
        const arr = busy[day];
        if (!arr || !arr.length) continue;
        for (const slot of meta.slots) {
          for (const b of arr) {
            if (slot[0] < b[1] && b[0] < slot[1]) return true;
          }
        }
      }
      return false;
    }
    function commit(meta) {
      meta.days.forEach(day => {
        if (!busy[day]) busy[day] = [];
        meta.slots.forEach(s => busy[day].push(s));
        dayCount[day] = (dayCount[day] || 0) + 1;
        if (dayCount[day] === 1) daysUsed++;
      });
    }
    function uncommit(meta) {
      meta.days.forEach(day => {
        busy[day].length -= meta.slots.length;
        dayCount[day]--;
        if (dayCount[day] === 0) { daysUsed--; delete dayCount[day]; delete busy[day]; }
      });
    }

    let bestScore = null, bestAssignment = null, feasible = false, stop = false, nodes = 0;
    const NODE_LIMIT = 250000;

    function recurse(i, fAcc, tAcc, assignment) {
      if (stop) return;
      nodes++;
      if (nodes > NODE_LIMIT) { stop = true; return; }

      if (i === order.length) {
        feasible = true;
        const better = !bestScore || fAcc < bestScore[0] || (fAcc === bestScore[0] && tAcc < bestScore[1]);
        if (better) { bestScore = [fAcc, tAcc]; bestAssignment = Object.assign({}, assignment); }
        if (stopAtFirst) stop = true;
        return;
      }

      const courseKey = order[i];
      const candidates = (data[courseKey] || []).map(entry => {
        const meta = getMeta(entry);
        return { entry: entry, meta: meta, fc: facultyCost(courseKey, entry) };
      }).sort((a, b) => a.fc - b.fc || a.meta.timeCost - b.meta.timeCost);

      for (const cand of candidates) {
        if (stop) return;
        const meta = cand.meta;
        if (!meta.days.length) continue;
        if (hasConflict(meta)) continue;
        const newDays = meta.days.filter(d => !dayCount[d]).length;
        if (daysUsed + newDays > maxDays) continue;

        commit(meta);
        assignment[courseKey] = cand.entry;
        recurse(i + 1, fAcc + cand.fc, tAcc + meta.timeCost, assignment);
        delete assignment[courseKey];
        uncommit(meta);
      }
    }

    recurse(0, 0, 0, {});
    return { feasible: feasible, bestAssignment: bestAssignment, bestScore: bestScore, nodes: nodes, capped: nodes > NODE_LIMIT };
  }

  function findMinimumDays(courseKeys, win, ranks, startFrom) {
    for (let d = startFrom; d <= 7; d++) {
      const r = solve(courseKeys, d, win, ranks, { stopAtFirst: true });
      if (r.feasible) return d;
    }
    return null;
  }

  // ---------- build & render ----------
  const buildBtn = document.getElementById('rb-build-btn');
  buildBtn.addEventListener('click', runBuild);

  function runBuild() {
    const courseKeys = Object.keys(data);
    if (!courseKeys.length) return;

    buildBtn.disabled = true;
    buildBtn.innerHTML = '<i class="fas fa-spinner"></i> Crunching the numbers\u2026';

    setTimeout(function () {
      const result = solve(courseKeys, rbMaxDays, rbWindow, facultyRanks, {});
      rbResults = { courseKeys: courseKeys, result: result };
      renderResult();
      buildBtn.disabled = false;
      buildBtn.innerHTML = '<i class="fas fa-calculator"></i> Build my routine';
    }, 30);
  }

  function renderResult() {
    const el = document.getElementById('rb-result');
    el.innerHTML = '';
    const courseKeys = rbResults.courseKeys, result = rbResults.result;

    if (!result.feasible) {
      const minDays = findMinimumDays(courseKeys, rbWindow, facultyRanks, rbMaxDays + 1);
      const banner = document.createElement('div');
      banner.className = 'rb-result-banner bad';
      if (minDays) {
        banner.innerHTML = '<i class="fas fa-triangle-exclamation"></i> These courses don\u2019t fit in ' + rbMaxDays + ' day' + (rbMaxDays === 1 ? '' : 's') + ' without a clash. The minimum possible is <strong>' + minDays + ' day' + (minDays === 1 ? '' : 's') + '</strong> \u2014 try raising the limit above.';
      } else {
        banner.innerHTML = '<i class="fas fa-triangle-exclamation"></i> No conflict-free combination exists for these courses at all, regardless of how many days you allow. Two of your courses likely always overlap \u2014 check their sections.';
      }
      el.appendChild(banner);
      return;
    }

    const assignment = result.bestAssignment;
    const usedDays = new Set();
    courseKeys.forEach(k => extractDays(assignment[k]).forEach(d => { if (d) usedDays.add(d); }));

    const banner = document.createElement('div');
    banner.className = 'rb-result-banner good';
    banner.innerHTML = '<i class="fas fa-circle-check"></i> Found a clash-free routine across <strong>' + usedDays.size + ' day' + (usedDays.size === 1 ? '' : 's') + '</strong>' + (result.capped ? ' (best found within the search budget)' : '') + '.';
    el.appendChild(banner);

    const dayChips = document.createElement('div');
    dayChips.className = 'rb-day-chips';
    DAY_ORDER.forEach(d => {
      const chip = document.createElement('div');
      chip.className = 'rb-day-chip' + (usedDays.has(d) ? ' used' : '');
      chip.textContent = d;
      dayChips.appendChild(chip);
    });
    el.appendChild(dayChips);

    courseKeys.forEach(courseKey => {
      const entry = assignment[courseKey];
      const ranks = facultyRanks[courseKey] || [];
      const code = teacherCodeOf(entry);
      const rankIdx = ranks.indexOf(code);

      const card = document.createElement('div');
      card.className = 'rb-result-card';

      let badge = '<span class="rb-badge nopref">no preference set</span>';
      if (rankIdx === 0) badge = '<span class="rb-badge pick1">your 1st pick</span>';
      else if (rankIdx > 0) badge = '<span class="rb-badge pickn">pick #' + (rankIdx + 1) + '</span>';

      const timeStrs = Array.isArray(entry.time) ? entry.time : [entry.time];
      const overtime = timeStrs.some(s => {
        const r = parseTimeRange(s);
        return r && (r[0] < rbWindow.start || r[1] > rbWindow.end);
      });

      card.innerHTML =
        '<div class="rb-result-card-top"><strong>' + courseKey + '</strong>' + badge + '</div>' +
        '<div class="rb-result-card-meta">' +
        '<span>Sec <strong>' + entry.section + '</strong></span>' +
        '<span><strong>' + teacherLabelOf(entry) + '</strong></span>' +
        '<span>' + entry.days + '</span>' +
        '<span class="' + (overtime ? 'rb-overtime' : '') + '">' + timeStrs.join(', ') + (overtime ? ' (outside window)' : '') + '</span>' +
        '</div>';
      el.appendChild(card);
    });

    const applyRow = document.createElement('div');
    applyRow.className = 'rb-apply-row';
    applyRow.innerHTML =
      '<button class="rb-apply-btn" id="rb-apply-btn"><i class="fas fa-check"></i> Apply this routine</button>' +
      '<button class="rb-retry-btn" id="rb-retry-btn">Try different limits</button>';
    el.appendChild(applyRow);

    document.getElementById('rb-apply-btn').addEventListener('click', function () { applyRoutine(assignment); });
    document.getElementById('rb-retry-btn').addEventListener('click', function () {
      el.innerHTML = '';
      document.getElementById('rb-body').scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  function applyRoutine(assignment) {
    Object.keys(assignment).forEach(courseKey => { selected[courseKey] = assignment[courseKey]; });
    saveSelected();
    renderSelected();
    renderSchedule();
    closeModal();
    Swal.fire({ icon: 'success', title: 'Routine applied', toast: true, position: 'top', timer: 1500, showConfirmButton: false });
  }

})();
</script>
